name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  composer:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.5.*'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
            phpunit: '10.5.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '11.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '11.*'
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            phpunit: '11.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            phpunit: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    env:
      # Laravel 10/11 still have Packagist advisories; Composer 2.9 blocks those
      # versions during resolve. This matrix is compatibility CI, not a production lock.
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies \
            --with="illuminate/cache:${{ matrix.laravel }}" \
            --with="illuminate/contracts:${{ matrix.laravel }}" \
            --with="illuminate/http:${{ matrix.laravel }}" \
            --with="illuminate/support:${{ matrix.laravel }}" \
            --with="orchestra/testbench:${{ matrix.testbench }}" \
            --with="phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
